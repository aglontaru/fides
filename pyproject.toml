[project]
name = "fides"
version = "0.1.0"
description = "Legislation Knowledge Graph RAG System — Rematiq Demo"
authors = [{ name = "Alex Glontaru" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"

dependencies = [
    # Agent framework
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "deepagents>=0.7",

    # MCP
    "langchain-mcp-adapters>=0.1",
    "mcp[cli]>=1.9",

    # LLM providers
    "langchain-ollama>=0.3",
    "langchain-google-genai>=2.1",

    # Neo4j
    "neo4j>=5.25",
    "langchain-neo4j>=0.2",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
    "python-multipart>=0.0.12",

    # Document processing
    "pymupdf>=1.25",

    # Configuration & validation
    "pydantic>=2.10",
    "pydantic-settings>=2.7",

    # Observability
    "structlog>=24.4",
    "rich>=13.9",

    # HTTP
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-docker>=3.1",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
]

[project.scripts]
fides-mcp = "fides.mcp_server.server:main"
fides-api = "fides.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fides"]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "RUF", # Ruff-specific
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "S101",   # assert used (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "T20"]
"scripts/**/*.py" = ["T20", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── MyPy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "langchain_mcp_adapters.*",
    "langchain_ollama.*",
    "langchain_google_genai.*",
    "neo4j.*",
    "pymupdf.*",
    "mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "fides.ingestion.parsers.pdf",
    "fides.mcp_server.tools.document_tools",
]
disallow_untyped_calls = false

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Docker services)",
    "eval: Agent evaluation tests (require LLM + Neo4j)",
]
addopts = "--strict-markers -ra"
